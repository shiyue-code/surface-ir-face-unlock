# See howdy.ini(5) for configuration options.

[core]
detection_notice = true
no_confirmation = false
abort_if_ssh = true
abort_if_lid_closed = true
disabled = false

[video]
timeout = 4
device_path = /dev/video42
warn_no_device = true
max_height = 320
frame_width = -1
frame_height = -1
clahe_enabled = true
clahe_clip_limit = 1.25
clahe_tile_grid_size = 8
dark_threshold = 75
force_mjpeg = false
exposure = -1
device_fps = 0
rotate = 0

[face]
yunet_score_threshold = 0.8845
yunet_nms_threshold = 0.3
yunet_top_k = 1000
sface_metric = cosine
sface_threshold = 0.6942

[debug]
end_report = false
